name: Validate infrastructure design

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/infrastructure-validation.yml"
      - "infrastructure/**"
  workflow_dispatch:

concurrency:
  group: infrastructure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"

jobs:
  terraform:
    name: Format, validate, and scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.3
          terraform_wrapper: false

      - name: Check formatting
        run: terraform -chdir=infrastructure fmt -check -recursive

      - name: Initialize without a state backend
        run: terraform -chdir=infrastructure init -backend=false -input=false -lockfile=readonly

      - name: Validate configuration
        run: terraform -chdir=infrastructure validate -no-color

      - name: Scan infrastructure configuration
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          exit-code: "1"
          hide-progress: "true"
          scan-ref: infrastructure
          scan-type: config
          severity: HIGH,CRITICAL
